name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint

      - name: Lint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links, style and changelog
        run: scripts/check-docs.sh

  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          uname -m
          swift --version

      - name: Run the test suite
        run: ./scripts/test.sh

      - name: Build the universal binary
        run: ./scripts/build.sh

      - name: Package the app, DMG and zip
        env:
          TOPMOST_RELEASE: "1"
        run: ./scripts/package.sh

      - name: Verify the bundle
        run: |
          codesign -dvvv build/Topmost.app
          lipo -archs build/Topmost.app/Contents/MacOS/Topmost
          ls -lh dist/
          cat dist/SHA256SUMS
