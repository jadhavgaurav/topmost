name: Feature request
description: Suggest an idea or an improvement for Topmost
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please look at the [known limitations](https://github.com/jadhavgaurav/topmost/blob/main/docs/LIMITATIONS.md) first, since some things cannot be done on macOS.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
