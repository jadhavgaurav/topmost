name: Bug Report
description: File a bug report to help improve Topmost
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      description: What version of macOS are you running? (e.g. macOS 14.5 Sonoma, macOS 15.0 Sequoia)
      placeholder: macOS 14.x
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Apple Silicon (M1/M2/M3/M4)
        - Intel (x86_64)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior.
      value: |
        1. Open application '...'
        2. Press 'Control + Command + P'
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
